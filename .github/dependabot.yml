version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "pnpm"
    directory: "/ecosystem/cranium-ai"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
  - package-ecosystem: "npm"
    directory: "/ecosystem/cranium-core"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
  - package-ecosystem: "npm"
    directory: "/ecosystem/cranium-ultra/projects/cranium-core-hardened"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
  - package-ecosystem: "npm"
    directory: "/ecosystem/cranium-ultra/projects/cranium-os"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
  - package-ecosystem: "npm"
    directory: "/ecosystem/worthwyl-forge"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
