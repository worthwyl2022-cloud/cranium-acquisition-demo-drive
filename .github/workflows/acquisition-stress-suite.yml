name: Acquisition Stress Suite

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  acquisition-stress-suite:
    name: Acquisition Stress Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ecosystem/cranium-kernel

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: ecosystem/cranium-kernel/package-lock.json

      - name: Install kernel dependencies
        run: npm ci

      - name: Run current acquisition verification suite
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:keys
          npm run verify:memory
          npm run verify:synapse
          npm run verify:keys-bound
          npm run verify:synapse-controller
          npm run atomic:recovery-check
          npm run verify:durable
          npm run verify:lifecycle
          npm run verify:conformance
          npm run verify:constitution
          npm run verify:constitution-runtime
          npm run verify:coma
          npm run verify:cognitive-subconscious
          npm run verify:proofing
          npm run verify:session-circuit-breaker
          npm run verify:synapse-adapter
