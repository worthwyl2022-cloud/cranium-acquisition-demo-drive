name: Acquisition Demo ISO

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate acquisition drive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: bash -n BUILD_ACQUISITION_ISO.sh HEALTH_CHECK.sh
      - run: bash HEALTH_CHECK.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Validate Commander build
        working-directory: ecosystem/commander
        run: |
          npm ci --ignore-scripts
          npm run lint
          npm run build

  build-iso:
    if: github.event_name != 'pull_request'
    name: Build acquisition ISO
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install ISO build dependencies
        run: sudo apt-get update && sudo apt-get install -y live-build xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin mtools dosfstools syslinux-utils
      - name: Build ISO
        env:
          CRANIUM_RELEASE_SIGNING_KEY: ${{ secrets.CRANIUM_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          key_file="$(mktemp /tmp/cranium-release-signing-key.XXXXXX.pem)"
          cleanup() { rm -f "$key_file"; }
          trap cleanup EXIT
          printf "%s\n" "$CRANIUM_RELEASE_SIGNING_KEY" > "$key_file"
          chmod 600 "$key_file"
          sudo env CRANIUM_RELEASE_SIGNING_KEY="$key_file" bash BUILD_ACQUISITION_ISO.sh
      - name: Verify ISO artifact
        run: xorriso -indev dist/cranium-acquisition-demo.iso -toc >/dev/null
      - name: Upload ISO
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cranium-acquisition-demo
          path: dist/cranium-acquisition-demo.iso
          if-no-files-found: error
