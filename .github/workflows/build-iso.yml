name: Acquisition Demo ISO

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate acquisition drive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: bash -n BUILD_ACQUISITION_ISO.sh HEALTH_CHECK.sh
      - run: bash HEALTH_CHECK.sh

  build-iso:
    name: Build acquisition ISO (validation-only on pull requests)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install ISO build dependencies
        run: sudo apt-get update && sudo apt-get install -y live-build xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin mtools dosfstools syslinux-utils qemu-system-x86 ovmf
      - name: Build validation-only ISO with ephemeral key
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          key_file="$(mktemp /tmp/convertible-cranium-validation-key.XXXXXX.pem)"
          cleanup() { rm -f "$key_file"; }
          trap cleanup EXIT
          openssl genpkey -algorithm ED25519 -out "$key_file" >/dev/null 2>&1
          chmod 600 "$key_file"
          sudo env CRANIUM_RELEASE_SIGNING_KEY="$key_file" bash BUILD_ACQUISITION_ISO.sh
      - name: Build signed release ISO
        if: github.event_name != 'pull_request'
        env:
          CRANIUM_RELEASE_SIGNING_KEY: ${{ secrets.CRANIUM_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          [[ -n "${CRANIUM_RELEASE_SIGNING_KEY:-}" ]] || { echo "Missing CRANIUM_RELEASE_SIGNING_KEY for trusted release build." >&2; exit 1; }
          key_file="$(mktemp /tmp/convertible-cranium-release-key.XXXXXX.pem)"
          cleanup() { rm -f "$key_file"; }
          trap cleanup EXIT
          printf "%s\n" "$CRANIUM_RELEASE_SIGNING_KEY" > "$key_file"
          chmod 600 "$key_file"
          sudo env CRANIUM_RELEASE_SIGNING_KEY="$key_file" bash BUILD_ACQUISITION_ISO.sh
      - name: Verify ISO artifact
        run: xorriso -indev dist/cranium-acquisition-demo.iso -toc >/dev/null
      - name: Boot ISO under QEMU and verify Linux reaches systemd
        shell: bash
        run: |
          set -euo pipefail
          firmware="$(find /usr/share/OVMF -maxdepth 1 -type f -name 'OVMF_CODE*.fd' -print -quit)"
          [[ -n "$firmware" ]] || { echo "OVMF firmware not found" >&2; exit 1; }
          serial_log="$RUNNER_TEMP/convertible-cranium-boot.log"
          set +e
          timeout --signal=TERM 180s qemu-system-x86_64 \
            -machine accel=tcg -m 4096 -smp 2 -bios "$firmware" \
            -cdrom dist/cranium-acquisition-demo.iso -boot d -display none -serial "file:$serial_log" \
            -monitor none -no-reboot -no-shutdown
          qemu_status=$?
          set -e
          if [[ "$qemu_status" -ne 124 && "$qemu_status" -ne 0 ]]; then
            cat "$serial_log" 2>/dev/null || true
            echo "QEMU exited unexpectedly: $qemu_status" >&2
            exit 1
          fi
          grep -q "Linux version" "$serial_log" || {
            cat "$serial_log" 2>/dev/null || true
            echo "Kernel boot was not observed on the serial console" >&2
            exit 1
          }
          grep -Eq 'Reached target.*(Basic System|Multi-User System|Graphical Interface)' "$serial_log" || {
            cat "$serial_log" 2>/dev/null || true
            echo "systemd target was not observed before timeout" >&2
            exit 1
          }
          echo "QEMU boot smoke test passed; Linux kernel and systemd target observed."
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: cranium-acquisition-demo-${{ github.event_name }}-${{ github.run_number }}
          path: dist/cranium-acquisition-demo.iso
          if-no-files-found: error
