name: Acquisition Demo ISO

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate acquisition drive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: bash -n BUILD_ACQUISITION_ISO.sh HEALTH_CHECK.sh
      - run: bash HEALTH_CHECK.sh

  build-iso:
    name: Build acquisition ISO
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Install ISO build dependencies
        run: sudo apt-get update && sudo apt-get install -y live-build xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin mtools dosfstools
      - name: Check out canonical Kernel for lineage
        uses: actions/checkout@v4
        with:
          repository: worthwyl2022-cloud/cranium-kernel
          path: .canonical-kernel
          fetch-depth: 1
      - name: Resolve canonical Kernel revision
        run: echo "CRANIUM_KERNEL_REVISION=$(git -C .canonical-kernel rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build ISO
        run: sudo -E bash BUILD_ACQUISITION_ISO.sh
      - name: Verify ISO artifact
        run: xorriso -indev dist/cranium-acquisition-demo.iso -toc >/dev/null
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: cranium-acquisition-demo
          path: dist/cranium-acquisition-demo.iso
          if-no-files-found: error
