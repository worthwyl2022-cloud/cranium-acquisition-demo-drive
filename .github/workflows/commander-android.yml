name: Commander Android Preview

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-preview:
    name: Build Commander Android preview
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ecosystem/commander/package-lock.json

      - name: Build Commander web bundle
        working-directory: ecosystem/commander
        run: |
          npm ci --ignore-scripts
          VITE_BASE=./ npm run build

      - name: Ensure Android SDK platform is available
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ -x "$SDKMANAGER" ]]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Assemble Android debug APK
        working-directory: ecosystem/commander/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Validate APK structure, manifest, signature, and alignment
        working-directory: ecosystem/commander/android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | tee /tmp/commander-badging.txt
          grep -Fq "package: name='com.worthwyl.cranium.commander'" /tmp/commander-badging.txt
          grep -Fq "minSdkVersion:'24'" /tmp/commander-badging.txt
          grep -Fq "targetSdkVersion:'36'" /tmp/commander-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
          sha256sum "$APK" | tee app-debug.apk.sha256

      - name: Upload APK and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cranium-command-android-preview
          path: |
            ecosystem/commander/android/app/build/outputs/apk/debug/app-debug.apk
            ecosystem/commander/android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 16 emulator smoke test
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r "$GITHUB_WORKSPACE/ecosystem/commander/android/app/build/outputs/apk/debug/app-debug.apk"
            adb shell am start -n com.worthwyl.cranium.commander/.MainActivity
            sleep 8
            adb shell dumpsys package com.worthwyl.cranium.commander | grep -F "com.worthwyl.cranium.commander"
            test -n "$(adb shell pidof com.worthwyl.cranium.commander)"
            adb shell pm path com.worthwyl.cranium.commander
            adb logcat -d -t 400 | grep -E "CraniumCommand|AndroidRuntime|chromium|crash|FATAL EXCEPTION" || true
